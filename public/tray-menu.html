<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InkNote</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1c212b;
      --bg-hover: rgba(255, 255, 255, 0.06);
      --border: #2a3140;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --danger: #f07178;
      --accent: #5b8def;
      --radius: 10px;
      --font: Inter, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      overflow: hidden;
      font-family: var(--font);
      user-select: none;
    }
    .panel {
      margin: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      padding: 6px;
      animation: in 140ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #7aa2f7, #3b6bc7);
    }
    .brand strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .brand span {
      color: var(--muted);
      font-size: 11px;
    }
    button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 9px 10px;
      border-radius: 7px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    button:hover { background: var(--bg-hover); }
    button:active { transform: scale(0.99); }
    button.danger { color: var(--danger); }
    button.danger:hover { background: rgba(240, 113, 120, 0.12); }
    .hint {
      color: var(--muted);
      font-size: 11px;
    }
    .sep {
      height: 1px;
      background: var(--border);
      margin: 4px 6px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <strong>InkNote</strong>
        <span>本地笔记</span>
      </div>
    </div>
    <button type="button" id="show">
      <span>显示主窗口</span>
      <span class="hint">打开</span>
    </button>
    <div class="sep"></div>
    <button type="button" id="quit" class="danger">
      <span>退出</span>
      <span class="hint">完全关闭</span>
    </button>
  </div>
  <script>
    const { invoke } = window.__TAURI__?.core || {};
    const { getCurrentWindow } = window.__TAURI__?.window || {};

    async function act(cmd) {
      try {
        if (invoke) await invoke(cmd);
      } catch (e) {
        console.error(e);
      }
      try {
        if (getCurrentWindow) await getCurrentWindow().hide();
      } catch (_) {}
    }

    document.getElementById("show").onclick = () => act("tray_show_main");
    document.getElementById("quit").onclick = () => act("tray_quit_app");

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") act("tray_hide_menu");
    });
    window.addEventListener("blur", () => act("tray_hide_menu"));
  </script>
</body>
</html>
