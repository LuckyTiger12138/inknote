<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InkNote Menu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1a1f28;
      --item-hover: rgba(91, 141, 239, 0.18);
      --border: rgba(255, 255, 255, 0.1);
      --text: #eef1f6;
      --danger: #ff7b84;
      --danger-hover: rgba(255, 123, 132, 0.14);
      --accent: #6b9af5;
      --font: "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
      cursor: default;
    }
    /* Entire window is the solid panel — no transparent hit-test holes */
    #panel {
      width: 100%;
      height: 100%;
      padding: 6px;
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), transparent 30%),
        var(--bg);
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.35),
        0 16px 36px rgba(0,0,0,0.55);
      opacity: 0;
      transform: translateY(4px) scale(0.98);
      transition: opacity 100ms ease, transform 120ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    #panel.show {
      opacity: 1;
      transform: none;
    }
    .item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .item:hover,
    .item:focus-visible {
      background: var(--item-hover);
      outline: none;
    }
    .item:active { background: rgba(91, 141, 239, 0.24); }
    .item .ico {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      color: var(--accent);
    }
    .item .ico svg { width: 12px; height: 12px; display: block; }
    .item .label { flex: 1; }
    .item.danger { color: var(--danger); }
    .item.danger .ico {
      color: var(--danger);
      background: rgba(255, 123, 132, 0.1);
    }
    .item.danger:hover { background: var(--danger-hover); }
    .sep {
      height: 1px;
      margin: 4px 8px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <div id="panel" role="menu">
    <button type="button" class="item" id="show" role="menuitem">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="14" rx="2"/>
          <path d="M8 21h8"/>
        </svg>
      </span>
      <span class="label">显示主窗口</span>
    </button>
    <div class="sep"></div>
    <button type="button" class="item danger" id="quit" role="menuitem">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span class="label">退出 InkNote</span>
    </button>
  </div>
  <script>
    const invoke = (...args) => {
      if (window.__TAURI_INTERNALS__?.invoke) {
        return window.__TAURI_INTERNALS__.invoke(...args);
      }
      if (window.__TAURI__?.core?.invoke) {
        return window.__TAURI__.core.invoke(...args);
      }
      return Promise.reject(new Error("no tauri"));
    };

    const panel = document.getElementById("panel");
    let closing = false;

    window.__inknotePlaceMenu = function () {
      closing = false;
      panel.classList.remove("show");
      requestAnimationFrame(() => {
        panel.classList.add("show");
        document.getElementById("show")?.focus();
      });
    };

    async function hide() {
      if (closing) return;
      closing = true;
      try {
        await invoke("tray_hide_menu");
      } catch (_) {
        closing = false;
      }
    }

    async function run(cmd) {
      closing = true;
      try {
        await invoke(cmd);
      } catch (e) {
        console.error(cmd, e);
        closing = false;
      }
    }

    // Blur backup: native focus-loss on Rust side is primary
    window.addEventListener("blur", () => {
      // Delay so item clicks still fire first
      setTimeout(() => {
        if (document.hasFocus()) return;
        hide();
      }, 120);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hide();
    });

    document.getElementById("show").onclick = (e) => {
      e.stopPropagation();
      run("tray_show_main");
    };
    document.getElementById("quit").onclick = (e) => {
      e.stopPropagation();
      run("tray_quit_app");
    };

    // Ready state for first open
    panel.classList.add("show");
  </script>
</body>
</html>
